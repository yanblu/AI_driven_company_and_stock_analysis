  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tyle=\"color: var(--success); font-family: var(--ff-mono); font-size:18px; flex-shrink: 0; line-height: 1.5;\">—<\u002Fspan>\n            <span style=\"font-family: var(--ff-display); font-size:18px; color: var(--ink); line-height: 1.45;\">The model has seen patterns like this in training<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- When It Doesn't -->\n      <div style=\"border: 1px solid rgba(207,45,86,0.22); border-radius: 8px; background: rgba(207,45,86,0.04); overflow: hidden; display: flex; flex-direction: column;\">\n        <div style=\"padding: 14px 20px; border-bottom: 1px solid rgba(207,45,86,0.15);\">\n          <div style=\"font-family: var(--ff-display); font-size:22px; font-weight: 600; letter-spacing: -0.01em; color: var(--error); margin-bottom: 5px;\">When It Doesn't<\u002Fdiv>\n          <div style=\"font-family: var(--ff-display); font-size:16px; color: var(--ink-55); font-style: italic;\">Regime break or transition<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; flex: 1;\">\n          <div style=\"display: flex; gap: 12px; align-items: flex-start;\">\n            <span style=\"color: var(--error); font-family: var(--ff-mono); font-size:18px; flex-shrink: 0; line-height: 1.5;\">—<\u002Fspan>\n            <span style=\"font-family: var(--ff-display); font-size:18px; color: var(--ink); line-height: 1.45;\">Unseen systemic shock — sector stress overrides TD-specific signal (e.g. SVB)<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; align-items: flex-start;\">\n            <span style=\"color: var(--error); font-family: var(--ff-mono); font-size:18px; flex-shrink: 0; line-height: 1.5;\">—<\u002Fspan>\n            <span style=\"font-family: var(--ff-display); font-size:18px; color: var(--ink); line-height: 1.45;\">Phase transition (crisis → recovery) — crisis signals persist into recovery (e.g. AML rebound)<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; align-items: flex-start;\">\n            <span style=\"color: var(--error); font-family: var(--ff-mono); font-size:18px; flex-shrink: 0; line-height: 1.5;\">—<\u002Fspan>\n            <span style=\"font-family: var(--ff-display); font-size:18px; color: var(--ink); line-height: 1.45;\">Signal semantics drift — same feature means different things in different phases<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; align-items: flex-start;\">\n            <span style=\"color: var(--error); font-family: var(--ff-mono); font-size:18px; flex-shrink: 0; line-height: 1.5;\">—<\u002Fspan>\n            <span style=\"font-family: var(--ff-display); font-size:18px; color: var(--ink); line-height: 1.45;\">Ensemble breakdown — at least two models disagree on current regime<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"slide-foot\"><div>TD Language Signals · Predictive Model<\u002Fdiv><div>09 · Predictive Model · Explainability<\u002Fdiv><\u002Fdiv>\n  <div class=\"foot-rule\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ SLIDE 10 — LIMITATIONS & NEXT STEPS ============ -->\n<section data-screen-label=\"10 Limitations &amp; Next Steps\" data-om-validate=\"no_overflowing_text,no_overlapping_text,slide_sized_text\" data-deck-slide=\"9\">\n  <div class=\"corner\"><span class=\"dot\"><\u002Fspan>TD · Multi-Signal ML System<\u002Fdiv>\n  <div class=\"slide-num mono\">10 / 11<\u002Fdiv>\n\n  <!-- Header -->\n  <div style=\"margin-top: 28px; margin-bottom: 20px;\">\n    <div class=\"eyebrow\" style=\"margin-bottom: 12px;\">Section VI · Limitations &amp; Next Steps<\u002Fdiv>\n    <h2 class=\"h-title\" style=\"font-size: 52px; letter-spacing: -0.03em;\">Limitations &amp; Next Steps<\u002Fh2>\n  <\u002Fdiv>\n\n  <!-- Two-column body — fills remaining height -->\n  <div style=\"f e-height: 1.5; padding-left: 32px;\">Predicts which way, not how far. Position sizing needs a separate layer.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Item 3 -->\n        <div style=\"border-top: 1px solid var(--ink-10); padding-top: 16px;\">\n          <div style=\"display: flex; gap: 16px; align-items: baseline; margin-bottom: 6px;\">\n            <div style=\"font-family: var(--ff-mono); font-size: 14px; color: var(--ink-40); letter-spacing: 0.1em; flex-shrink: 0;\">03<\u002Fdiv>\n            <div style=\"font-family: var(--ff-display); font-size: 24px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em;\">Signals break when the regime changes<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family: var(--ff-display); font-size: 20px; color: var(--ink); line-height: 1.5; padding-left: 32px;\">The model cannot detect when its learned patterns have stopped applying. Fold 1: SVB panic was never in the training window. Fold 8: AML fine was already priced in but bearish signals kept firing.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Item 4 -->\n        <div style=\"border-top: 1px solid var(--ink-10); padding-top: 16px;\">\n          <div style=\"display: flex; gap: 16px; align-items: baseline; margin-bottom: 6px;\">\n            <div style=\"font-family: var(--ff-mono); font-size: 14px; color: var(--ink-40); letter-spacing: 0.1em; flex-shrink: 0;\">04<\u002Fdiv>\n            <div style=\"font-family: var(--ff-display); font-size: 24px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em;\">Narrow news coverage<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family: var(--ff-display); font-size: 20px; color: var(--ink); line-height: 1.5; padding-left: 32px;\">Only TD's own press releases. Broader macro and market news is excluded.<\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Divider -->\n    <div style=\"background: var(--ink-10);\"><\u002Fdiv>\n\n    <!-- RIGHT: Next Step ottom: 1px solid var(--ink-10);\">\n          <td style=\"padding: 3px 24px 3px 0; font-family: var(--ff-mono); font-size: 12px; color: var(--ink);\">FY2025Q4<\u002Ftd>\n          <td style=\"padding: 3px 24px; color: var(--ink);\">2025-12-04<\u002Ftd>\n          <td style=\"padding: 3px 24px; color: var(--ink);\">2026-04-02<\u002Ftd>\n          <td style=\"padding: 3px 0 3px 24px; text-align: right; color: var(--ink);\">82<\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <td style=\"padding: 3px 24px 3px 0; font-family: var(--ff-mono); font-size: 12px; color: var(--ink);\">FY2026Q1<\u002Ftd>\n          <td style=\"padding: 3px 24px; color: var(--ink);\">2026-04-03<\u002Ftd>\n          <td style=\"padding: 3px 24px; color: var(--ink);\">2026-04-09 (end)<\u002Ftd>\n          <td style=\"padding: 3px 0 3px 24px; text-align: right; color: var(--ink);\">4<\u002Ftd>\n        <\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n\n  <\u002Fdiv>\n\n  <div class=\"slide-foot\"><div>TD Language Signals · Predictive Model<\u002Fdiv><div>Appendix A2 · Feature Engineering<\u002Fdiv><\u002Fdiv>\n  <div class=\"foot-rule\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ SLIDE 15 — APPENDIX A4 ============ -->\n<section data-screen-label=\"15 Appendix A4\" style=\"padding: 56px 96px 56px;\" data-om-validate=\"no_overflowing_text,no_overlapping_text,slide_sized_text\" data-deck-slide=\"14\" data-deck-active=\"\">\n  <div class=\"corner\"><span class=\"dot\"><\u002Fspan>TD · Multi-Signal ML System<\u002Fdiv>\n  <div class=\"slide-num mono\">A3<\u002Fdiv>\n\n  <!-- Header -->\n  <div style=\"margin-top: 40px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--ink-20);\">\n    <div class=\"eyebrow\" style=\"margin-bottom: 14px;\">Appendix<\u002Fdiv>\n    <h2 class=\"h-title\" style=\"font-size: 42px; letter-spacing: -0.03em; margin: 0;\">Design Choices &amp; Hyperparameters<\u002Fh2>\n  <\u002Fdiv>\n\n  <!-- TOP ROW — Picked | Rejected -->\n  <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-bottom: 14px;\">\n\n    <!-- LEFT — What We Picked -->\n    <div style=\"padding-right: 32px; border-right: 1px solid var(--ink-10);\">\n      <div style=\"font-family: var(--ff-display); font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--orange); margin-bottom: 12px;\">What We Picked<\u002Fdiv>\n\n      <!-- XGBoost -->\n      <div style=\"margin-bottom: 12px;\">\n        <div style=\"font-family: var(--ff-display); font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 4px;\">XGBoost <span style=\"font-weight: 400; font-size: 16px; color: var(--ink);\">vs alternatives<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 15px; color: var(--ink); line-height: 1.5; margin-bottom: 8px;\">Native multiclass probability output (<span style=\"font-family: var(--ff-mono); font-size: 12px;\">multi:softprob<\u002Fspan>), built-in L1/L2 regularisation, and native missing-value handling — important with ~800 training rows per fold and no separate imputation step.<\u002Fdiv>\n        <table style=\"width: 100%; border-collapse: collapse; font-size: 13px; font-family: var(--ff-display); table-layout: fixed;\">\n          <colgroup><col style=\"width: 38%;\"><col style=\"width: 62%;\"><\u002Fcolgroup>\n          <thead>\n            <tr style=\"border-bottom: 1.5px solid var(--ink-20);\">\n              <th style=\"text-align: left; padding: 0 8px 5px 0; font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink);\">Algorithm<\u002Fth>\n              <th style=\"text-align: left; padding: 0 0 5px 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink);\">Reason not chosen<\u002Fth>\n            <\u002Ftr>\n          <\u002Fthead>\n          <tbody>\n            <tr style=\"background: rgba(245,78,0,0.08); border-bottom: 1px solid var(--ink-10);\">\n              <td style=\"padding: 5px 8px 5px 0; font-weight: 700; color: var(--ink);\">XGBoost ✓<\u002Ftd>\n              <td style=\"padding: 5px 0 5px 8px; color: var(--ink); font-weight: 600;\">Selected — native multiclass, regularisation, handles missing values<\u002Ftd>\n            <\u002Ftr>\n            <tr style=\"border-bottom: 1px solid var(--ink-10);\">\n              <td style=\"padding: 5px 8px 5px 0; color: var(--ink);\">LightGBM<\u002Ftd>\n              <td style=\"padding: 5px 0 5px 8px; color: var(--ink);\">Tested; no meaningful performance difference on this dataset<\u002Ftd>\n            <\u002Ftr>\n            <tr style=\"border-bottom: 1px solid var(--ink-10);\">\n              <td style=\"padding: 5px 8px 5px 0; color: var(--ink);\">Logistic regression<\u002Ftd>\n              <td style=\"padding: 5px 0 5px 8px; color: var(--ink);\">Cannot capture non-linear interactions between features<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td style=\"padding: 5px 8px 5px 0; color: var(--ink);\">Neural networks<\u002Ftd>\n              <td style=\"padding: 5px 0 5px 8px; color: var(--ink);\">Inappropriate for this data scale (~800 rows per fold)<\u002Ftd>\n            <\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n\n      <!-- Three separate models -->\n      <div style=\"margin-bottom: 12px;\">\n        <div style=\"font-family: var(--ff-display); font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 4px;\">Three separate models <span style=\"font-weight: 400; font-size: 16px; color: var(--ink);\">vs single combined model<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 16px; color: var(--ink); line-height: 1.5;\">Transcript features forward-fill for 56–82 trading days; mixing near-static signals with daily price and news in one model produces misleading feature interactions. Separate models also allow each signal source to be inspected and fixed independently.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Hard majority vote -->\n      <div>\n        <div style=\"font-family: var(--ff-display); font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 4px;\">Hard majority vote <span style=\"font-weight: 400; font-size: 16px; color: var(--ink);\">vs soft-prob averaging<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 16px; color: var(--ink); line-height: 1.5;\">Achieved 56.6% directional accuracy vs. 53.6% for soft-prob averaging. The models predict direction reliably but are not well-calibrated in probability space — hard voting uses the directional signal and ignores the miscalibrated confidence.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- RIGHT — What Was Tested and Rejected -->\n    <div style=\"padding-left: 32px;\">\n      <div style=\"font-family: var(--ff-display); font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--orange); margin-bottom: 12px;\">What We Tested and Rejected<\u002Fdiv>\n      <table style=\"width: 100%; border-collapse: collapse; font-size: 16px; font-family: var(--ff-display); table-layout: fixed;\">\n        <colgroup>\n          <col style=\"width: 42%;\">\n          <col style=\"width: 58%;\">\n        <\u002Fcolgroup>\n        <thead>\n          <tr style=\"border-bottom: 1.5px solid var(--ink-20);\">\n            <th style=\"text-align: left; padding: 0 12px 6px 0; font-size: 13px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink);\">Feature / Choice<\u002Fth>\n            <th style=\"text-align: left; padding: 0 0 6px 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink);\">Reason Rejected<\u002Fth>\n          <\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr style=\"border-bottom: 1px solid var(--ink-10);\">\n            <td style=\"padding: 6px 12px 6px 0; vertical-align: top; color: var(--ink);\">60-day price returns<\u002Ftd>\n            <td style=\"padding: 6px 0 6px 12px; vertical-align: top; color: var(--ink); line-height: 1.4;\">Adds noise at 5-day horizon; quarterly retraining already captures regime shifts<\u002Ftd>\n          <\u002Ftr>\n          <tr style=\"border-bottom: 1px solid var(--ink-10);\">\n            <td style=\"padding: 6px 12px 6px 0; vertical-align: top; color: var(--ink);\">Volume change features<\u002Ftd>\n            <td style=\"padding: 6px 0 6px 12px; vertical-align: top; color: var(--ink); line-height: 1.4;\">No directional mechanism; empirically reduced performance<\u002Ftd>\n          <\u002Ftr>\n          <tr style=\"border-bottom: 1px solid var(--ink-10);\">\n            <td style=\"padding: 6px 12px 6px 0; vertical-align: top; color: var(--ink);\">90-day news window<\u002Ftd>\n            <td style=\"padding: 6px 0 6px 12px; vertical-align: top; color: var(--ink); line-height: 1.4;\">Dilutes short-horizon signal<\u002Ftd>\n          <\u002Ftr>\n          <tr style=\"border-bottom: 1px solid var(--ink-10);\">\n            <td style=\"padding: 6px 12px 6px 0; vertical-align: top; color: var(--ink);\"><span style=\"font-family: var(--ff-mono); font-size: 12px;\">call_decay<\u002Fspan> on NLP features<\u002Ftd>\n            <td style=\"padding: 6px 0 6px 12px; vertical-align: top; color: var(--ink); line-height: 1.4;\">Near-perfect multicollinearity; replaced by <span style=\"font-family: var(--ff-mono); font-size: 12px;\">days_since_call<\u002Fspan><\u002Ftd>\n          <\u002Ftr>\n          <tr style=\"border-bottom: 1px solid var(--ink-10);\">\n            <td style=\"padding: 6px 12px 6px 0; vertical-align: top; color: var(--ink);\">Macro features (FX, CPI, rates)<\u002Ftd>\n            <td style=\"padding: 6px 0 6px 12px; vertical-align: top; color: var(--ink); line-height: 1.4;\">Already embedded in XFN benchmark; would double-count sector movement<\u002Ftd>\n          <\u002Ftr>\n          <tr style=\"border-bottom: 1px solid var(--ink-10);\">\n            <td style=\"padding: 6px 12px 6px 0; vertical-align: top; color: var(--ink);\">Single combined model<\u002Ftd>\n            <td style=\"padding: 6px 0 6px 12px; vertical-align: top; color: var(--ink); line-height: 1.4;\">Loss of interpretability; misleading feature interactions between stale and fresh signals<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td style=\"padding: 6px 12px 6px 0; vertical-align: top; color: var(--ink);\">Soft-prob averaging<\u002Ftd>\n            <td style=\"padding: 6px 0 6px 12px; vertical-align: top; color: var(--ink); line-height: 1.4;\">Underperformed hard vote; models are not probability-calibrated<\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- BOTTOM SECTION — 3-cell layout -->\n  <div style=\"padding-top: 12px; border-top: 1.5px solid var(--ink-20); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0;\">\n\n    <!-- CELL 1 — Hyperparameter Search -->\n    <div style=\"padding-right: 24px; border-right: 1px solid var(--ink-10);\">\n      <div style=\"font-family: var(--ff-display); font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--orange); margin-bottom: 8px;\">Hyperparameter Search<\u002Fdiv>\n      <table style=\"width: 100%; border-collapse: collapse; font-size: 14px; font-family: var(--ff-display); table-layout: fixed;\">\n        <colgroup><col style=\"width: 55%;\"><col style=\"width: 45%;\"><\u002Fcolgroup>\n        <thead>\n          <tr style=\"border-bottom: 1.5px solid var(--ink-20);\">\n            <th style=\"text-align: left; padding: 0 8px 4px 0; font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink);\">Parameter<\u002Fth>\n            <th style=\"text-align: left; padding: 0 0 4px 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink);\">Search Range<\u002Fth>\n          <\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr style=\"border-bottom: 1px solid var(--ink-10);\"><td style=\"padding: 4px 8px 4px 0;\"><span style=\"font-family: var(--ff-mono); font-size: 12px; color: var(--ink);\">max_depth<\u002Fspan><\u002Ftd><td style=\"padding: 4px 0 4px 8px; color: var(--ink);\">2, 3, 4<\u002Ftd><\u002Ftr>\n          <tr style=\"border-bottom: 1px solid var(--ink-10);\"><td style=\"padding: 4px 8px 4px 0;\"><span style=\"font-family: var(--ff-mono); font-size: 12px; color: var(--ink);\">min_child_weight<\u002Fspan><\u002Ftd><td style=\"padding: 4px 0 4px 8px; color: var(--ink);\">10, 20, 30<\u002Ftd><\u002Ftr>\n          <tr style=\"border-bottom: 1px solid var(--ink-10);\"><td style=\"padding: 4px 8px 4px 0;\"><span style=\"font-family: var(--ff-mono); font-size: 12px; color: var(--ink);\">n_estimators<\u002Fspan><\u002Ftd><td style=\"padding: 4px 0 4px 8px; color: var(--ink);\">50, 80, 120<\u002Ftd><\u002Ftr>\n          <tr style=\"border-bottom: 1px solid var(--ink-10);\"><td style=\"padding: 4px 8px 4px 0;\"><span style=\"font-family: var(--ff-mono); font-size: 12px; color: var(--ink);\">reg_alpha<\u002Fspan> (L1)<\u002Ftd><td style=\"padding: 4px 0 4px 8px; color: var(--ink);\">0.0, 0.2<\u002Ftd><\u002Ftr>\n          <tr><td style=\"padding: 4px 8px 4px 0;\"><span style=\"font-family: var(--ff-mono); font-size: 12px; color: var(--ink);\">reg_lambda<\u002Fspan> (L2)<\u002Ftd><td style=\"padding: 4px 0 4px 8px; color: var(--ink);\">1.0, 2.0<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <div style=\"margin-top: 6px; font-size: 12px; color: var(--ink);\">108 configs × 3 models · Criterion: <span style=\"font-family: var(--ff-mono); font-size: 11px;\">0.6 × dir_accuracy + 0.4 × macro_F1<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- CELL 2 — Best Configurations -->\n    <div style=\"padding: 0 24px; border-right: 1px solid var(--ink-10);\">\n      <div style=\"font-family: var(--ff-display); font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--orange); margin-bottom: 8px;\">Best Configurations<\u002Fdiv>\n      <table style=\"width: 100%; border-collapse: collapse; font-size: 13px; font-family: var(--ff-display); table-layout: fixed;\">\n        <colgroup><col style=\"width: 22%;\"><col style=\"width: 14%;\"><col style=\"width: 20%;\"><col style=\"width: 18%;\"><col style=\"width: 13%;\"><col style=\"width: 13%;\"><\u002Fcolgroup>\n        <thead>\n          <tr style=\"border-bottom: 1.5px solid var(--ink-20);\">\n            <th style=\"text-align: left; padding: 0 4px 4px 0; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink);\">Model<\u002Fth>\n            <th style=\"text-align: center; padding: 0 4px 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink);\">depth<\u002Fth>\n            <th style=\"text-align: center; padding: 0 4px 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink);\">min_child<\u002Fth>\n            <th style=\"text-align: center; padding: 0 4px 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink);\">n_est<\u002Fth>\n            <th style=\"text-align: center; padding: 0 4px 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink);\">α<\u002Fth>\n            <th style=\"text-align: center; padding: 0 0 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink);\">λ<\u002Fth>\n          <\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr style=\"border-bottom: 1px solid var(--ink-10);\"><td style=\"padding: 5px 4px 5px 0; font-weight: 600; color: var(--ink);\">Price<\u002Ftd><td style=\"padding: 5px 4px; text-align: center; font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">3<\u002Ftd><td style=\"padding: 5px 4px; text-align: center; font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">30<\u002Ftd><td style=\"padding: 5px 4px; text-align: center; font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">120<\u002Ftd><td style=\"padding: 5px 4px; text-align: center; font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">0.0<\u002Ftd><td style=\"padding: 5px 0; text-align: center; font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">1.0<\u002Ftd><\u002Ftr>\n          <tr style=\"border-bottom: 1px solid var(--ink-10);\"><td style=\"padding: 5px 4px 5px 0; font-weight: 600; color: var(--ink);\">Transcript<\u002Ftd><td style=\"padding: 5px 4px; text-align: center; font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">4<\u002Ftd><td style=\"padding: 5px 4px; text-align: center; font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">20<\u002Ftd><td style=\"padding: 5px 4px; text-align: center; font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">80<\u002Ftd><td style=\"padding: 5px 4px; text-align: center; font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">0.2<\u002Ftd><td style=\"padding: 5px 0; text-align: center; font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">1.0<\u002Ftd><\u002Ftr>\n          <tr><td style=\"padding: 5px 4px 5px 0; font-weight: 600; color: var(--ink);\">News<\u002Ftd><td style=\"padding: 5px 4px; text-align: center; font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">2<\u002Ftd><td style=\"padding: 5px 4px; text-align: center; font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">30<\u002Ftd><td style=\"padding: 5px 4px; text-align: center; font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">50<\u002Ftd><td style=\"padding: 5px 4px; text-align: center; font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">0.2<\u002Ftd><td style=\"padding: 5px 0; text-align: center; font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">2.0<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <div style=\"margin-top: 6px; font-size: 12px; color: var(--ink); font-style: italic;\">Best parameters tuned 2026-04-23 on folds 4–10.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- CELL 3 — XFN Composition -->\n    <div style=\"padding-left: 24px; display: flex; flex-direction: column;\">\n      <div style=\"font-family: var(--ff-display); font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--orange); margin-bottom: 8px;\">XFN Benchmark Composition<\u002Fdiv>\n      <div style=\"font-size: 13px; color: var(--ink); line-height: 1.5; margin-bottom: 10px;\">XFN (iShares S&amp;P/TSX Capped Financials ETF) is TD's most direct liquid peer benchmark, with the major Canadian banks as its top holdings.<\u002Fdiv>\n      <!-- Donut chart -->\n      <div style=\"display: flex; align-items: center; gap: 14px; flex: 1;\">\n        <svg id=\"xfn-donut\" width=\"130\" height=\"130\" viewBox=\"0 0 130 130\" style=\"flex-shrink: 0;\"><\u002Fsvg>\n        <div id=\"xfn-legend\" style=\"font-family: var(--ff-display); font-size: 12px; color: var(--ink); line-height: 1.9;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size: 11px; color: var(--ink); font-style: italic; margin-top: 6px;\">Approximate weights, rebalanced periodically. Source: iShares Canada.<\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <script>\n  (function(){\n    var slices = [\n      { label: 'RY', pct: 25, color: '#26251e' },\n      { label: 'TD', pct: 19, color: '#f54e00' },\n      { label: 'BNS', pct: 11, color: '#6b6a62' },\n      { label: 'BMO', pct: 10, color: '#9a9990' },\n      { label: 'CM', pct: 8,  color: '#b8b7af' },\n      { label: 'MFC', pct: 6,  color: '#cccbc4' },\n      { label: 'SLF', pct: 4,  color: '#d8d7d0' },\n      { label: 'Other', pct: 17, color: '#e6e5e0' }\n    ];\n    var cx = 65, cy = 65, r = 52, inner = 30;\n    var ns = 'http://www.w3.org/2000/svg';\n    var svg = document.getElementById('xfn-donut');\n    var total = slices.reduce(function(a,s){ return a+s.pct; }, 0);\n    var angle = -Math.PI/2;\n    slices.forEach(function(s){\n      var sweep = (s.pct/total) * 2 * Math.PI;\n      var x1 = cx + r*Math.cos(angle), y1 = cy + r*Math.sin(angle);\n      var x2 = cx + r*Math.cos(angle+sweep), y2 = cy + r*Math.sin(angle+sweep);\n      var ix1 = cx + inner*Math.cos(angle), iy1 = cy + inner*Math.sin(angle);\n      var ix2 = cx + inner*Math.cos(angle+sweep), iy2 = cy + inner*Math.sin(angle+sweep);\n      var large = sweep > Math.PI ? 1 : 0;\n      var d = ['M',x1,y1,'A',r,r,0,large,1,x2,y2,'L',ix2,iy2,'A',inner,inner,0,large,0,ix1,iy1,'Z'].join(' ');\n      var path = document.createElementNS(ns,'path');\n      path.setAttribute('d', d);\n      path.setAttribute('fill', s.color);\n      path.setAttribute('stroke', '#f2f1ed');\n      path.setAttribute('stroke-width', '1.5');\n      svg.appendChild(path);\n      angle += sweep;\n    });\n    var leg = document.getElementById('xfn-legend');\n    slices.forEach(function(s){\n      var row = document.createElement('div');\n      row.style.display = 'flex';\n      row.style.alignItems = 'center';\n      row.style.gap = '6px';\n      var dot = document.createElement('span');\n      dot.style.cssText = 'width:10px;height:10px;border-radius:2px;background:'+s.color+';flex-shrink:0;display:inline-block;';\n      var txt = document.createElement('span');\n      txt.style.color = '#26251e';\n      txt.style.fontWeight = s.label==='TD' ? '700' : '400';\n      txt.textContent = s.label + ' ~' + s.pct + '%';\n      row.appendChild(dot); row.appendChild(txt);\n      leg.appendChild(row);\n    });\n  })();\n  <\u002Fscript>\n\n  <div class=\"slide-foot\"><div>TD Language Signals · Predictive Model<\u002Fdiv><div>Appendix A3 · Design Choices &amp; Hyperparameters<\u002Fdiv><\u002Fdiv>\n  <div class=\"foot-rule\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ SLIDE 16 — APPENDIX A7 ============ -->\n<section data-screen-label=\"16 Appendix A7\" style=\"padding: 56px 96px 56px;\">\n  <div class=\"corner\"><span class=\"dot\"><\u002Fspan>TD · Multi-Signal ML System<\u002Fdiv>\n  <div class=\"slide-num mono\">A4<\u002Fdiv>\n\n  <!-- Header -->\n  <div style=\"margin-top: 40px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--ink-20);\">\n    <div class=\"eyebrow\" style=\"margin-bottom: 14px;\">Appendix<\u002Fdiv>\n    <h2 class=\"h-title\" style=\"font-size: 42px; letter-spacing: -0.03em; margin: 0;\">Evaluation Methodology &amp; Per-Fold Performance<\u002Fh2>\n  <\u002Fdiv>\n\n  <!-- TOP SECTION — Evaluation Methodology -->\n  <div style=\"margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--ink-20);\">\n    <div style=\"font-family: var(--ff-display); font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--orange); margin-bottom: 12px;\">Evaluation Methodology<\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0;\">\n\n      <!-- Sub-section 1 — Stride-offset averaging -->\n      <div style=\"padding-right: 32px; border-right: 1px solid var(--ink-10);\">\n        <div style=\"font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 6px;\">Stride-Offset Averaging<\u002Fdiv>\n        <div style=\"font-size: 16px; color: var(--ink); line-height: 1.5;\">The 5-day forward return target means consecutive test days share 4 days of return data — they are not independent. To avoid inflating estimates, every 5th observation is taken (a non-overlapping subset). Metrics are computed for each of the 5 valid offsets (0–4) and averaged. All test days are used across the 5 offsets combined.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Sub-section 2 — Metric definitions -->\n      <div style=\"padding: 0 32px; border-righ tical-align: top;\"><span style=\"font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">auc_pos<\u002Fspan><\u002Ftd>\n              <td style=\"padding: 5px 0 5px 8px; vertical-align: top; color: var(--ink); line-height: 1.4;\">OVR AUC for +1 class using softmax P(+1); diagnostic only<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td style=\"padding: 5px 8px 5px 0; vertical-align: top;\"><span style=\"font-family: var(--ff-mono); font-size: 13px; color: var(--ink);\">auc_neg<\u002Fspan><\u002Ftd>\n              <td style=\"padding: 5px 0 5px 8px; vertical-align: top; color: var(--ink); line-height: 1.4;\">OVR AUC for −1 class using softmax P(−1); diagnostic only<\u002Ftd>\n            <\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n\n      <!-- Sub-section 3 — Why these metrics -->\n      <div style=\"padding-left: 32px;\">\n        <div style=\"font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 6px;\">Why These Metrics<\u002Fdiv>\n        <div style=\"font-size: 16px; color: var(--ink); line-height: 1.5;\">Mean accuracy is excluded because it is dominated by the neutral class — a model that always predicts neutral would score well without any genuine directional signal. <span style=\"font-family: var(--ff-mono); font-size: 12px;\">directional_accuracy<\u002Fspan> measures only the calls the model commits to. AUC is retained as a diagnostic on sub-model probabilities only and does not factor into ensemble selection.<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- BOTTOM SECTION — Per-Fold Performance -->\n  <div style=\"flex: 1; min-height: 0;\">\n    <div style=\"font-family: var(--ff-display); font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--orange); margin-bottom: 8px;\">Hard Majority Vote — Per-Fold Performance<\u002Fdiv>\n    <table style=\"width: 100%; border-collapse: collapse; font-size: 14px; font-fam "><\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdeck-stage>\n\n<script>\n(function () {\n  /* ── palette ─────────────────────────────────────── */\n  var INK    = '#26251e';\n  var INK55  = 'rgba(38,37,30,0.72)';\n  var INK10  = 'rgba(38,37,30,0.10)';\n  var ERROR  = '#cf2d56';\n  var GOLD   = '#c08532';\n  var SUCCESS= '#1f8a65';\n  var MONO   = '\"Berkeley Mono\",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace';\n\n  function ns(tag, attr) {\n    var el = document.createElementNS('http://www.w3.org/2000/svg', tag);\n    for (var k in attr) el.setAttribute(k, attr[k]);\n    return el;\n  }\n  function line(pts) {\n    return pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');\n  }\n  function text(svg, x, y, str, opts) {\n    var t = ns('text', Object.assign({ x:x, y:y, 'font-family':MONO, 'font-size':10, fill:INK55 }, opts));\n    t.textContent = str;\n    svg.appendChild(t);\n  }\n  function gridLines(svg, padL, padT, cW, cH, ticks) {\n    ticks.forEach(function(t) {\n      var y = padT + cH * t;\n      svg.appendChild(ns('line', { x1:padL, y1:y, x2:padL+cW, y2:y, stroke:INK10, 'stroke-width':1 }));\n    });\n  }\n  function annotationLine(svg, x, padT, cH, label, labelSide) {\n    svg.appendChild(ns('line', { x1:x, y1:padT-6, x2:x, y2:padT+cH, stroke:ERROR, 'stroke-width':2.5, 'stroke-dasharray':'5,3' }));\n    var tx = labelSide === 'left' ? x - 6 : x + 6;\n    var anchor = labelSide === 'left' ? 'end' : 'start';\n    text(svg, tx, padT+14, 'AML Consent Order', { fill:ERROR, 'font-size':9.5, 'text-anchor':anchor, 'letter-spacing':'0.05em', 'font-weight':'600' });\n    text(svg, tx, padT+26, 'Oct 2024', { fill:ERROR, 'font-size':9, 'text-anchor':anchor, 'fill-opacity':0.75 });\n  }\n\n  /* ───────────────────────────────────────────────────\n     PHASE 1 — dual-axis line chart\n     Left axis:  AML share %\n     Right axis: AML sentiment (reversed colour = error)\n  ─────────────────────────────────────────────────── */\n  function drawP1() {\n    var el = document.getElementById('s6-chart-p1');\n    if (!el) return;\n    var W = el.offsetWidth || 460;\n    var H = 210;\n    var pad = { t:24, r:42, b:34, l:40 };\n    var cW = W - pad.l - pad.r;\n    var cH = H - pad.t - pad.b;\n\n    var cats   = ['2022Q1','2023Q2','2023Q3','2024Q2','2024Q3','2024Q4','2025Q1'];\n    var share  = [11.1, 11.5, 17.6, 20.5, 22.4, 30.0, 21.0];\n    var sent   = [0.239, 0.124, 0.070, 0.152, 0.055, 0.033, 0.155];\n    var n = cats.length;\n    /* segments where we skip ≥1 quarter: 0→1 (5-qtr gap), 2→3 (2-qtr gap) */\n    var p1Dotted = [0, 2];\n\n    var xOf    = function(i){ return pad.l + (i/(n-1))*cW; };\n    var yShare = function(v){ return pad.t + cH*(1 - v/35); };\n    var ySent  = function(v){ return pad.t + cH*(1 - v/0.28); };\n\n    var svg = ns('svg', { width:W, height:H, viewBox:'0 0 '+W+' '+H });\n    gridLines(svg, pad.l, pad.t, cW, cH, [0, 0.25, 0.5, 0.75, 1]);\n\n    /* annotation at FY2024Q4 = index 5 */\n    annotationLine(svg, xOf(5), pad.t, cH, 'AML Consent Order', 'left');\n\n    /* share fill */\n    var sFill = share.map(function(v,i){ return [xOf(i), yShare(v)]; });\n    var fillPath = line(sFill) + ' L'+xOf(n-1).toFixed(1)+','+(pad.t+cH)+' L'+xOf(0).toFixed(1)+','+(pad.t+cH)+' Z';\n    svg.appendChild(ns('path', { d:fillPath, fill:'rgba(38,37,30,0.06)', stroke:'none' }));\n\n    /* share line — segment-by-segment for dotted treatment */\n    sFill.forEach(function(p,i) {\n      if (i === sFill.length - 1) return;\n      var attrs = { d:'M'+p[0].toFixed(1)+','+p[1].toFixed(1)+' L'+sFill[i+1][0].toFixed(1)+','+sFill[i+1][1].toFixed(1), fill:'none', stroke:INK, 'stroke-width':2 };\n      if (p1Dotted.indexOf(i) !== -1) attrs['stroke-dasharray'] = '4,3';\n      svg.appendChild(ns('path', attrs));\n    });\n    sFill.forEach(function(p,i) {\n      svg.appendChild(ns('circle', { cx:p[0], cy:p[1], r:i===n-1?4:3, fill:INK }));\n    });\n\n    /* sentiment line — segment-by-segment */\n    var stPts = sent.map(function(v,i){ return [xOf(i), ySent(v)]; });\n    stPts.forEach(function(p,i) {\n      if (i === stPts.length - 1) return;\n      var attrs = { d:'M'+p[0].toFixed(1)+','+p[1].toFixed(1)+' L'+stPts[i+1][0].toFixed(1)+','+stPts[i+1][1].toFixed(1), fill:'none', stroke:ERROR, 'stroke-width':2 };\n      if (p1Dotted.indexOf(i) !== -1) attrs['stroke-dasharray'] = '4,3';\n      svg.appendChild(ns('path', attrs));\n    });\n    stPts.forEach(function(p){ svg.appendChild(ns('circle', { cx:p[0], cy:p[1], r:3, fill:ERROR })); });\n\n    /* left y-axis: share */\n    [0,10,20,30].forEach(function(v){\n      text(svg, pad.l-5, yShare(v)+4, v+'%', { 'text-anchor':'end', fill:INK55, 'font-size':9.5 });\n    });\n    /* right y-axis: sentiment */\n    [0, 0.1, 0.2].forEach(function(v){\n      text(svg, pad.l+cW+5, ySent(v)+4, v.toFixed(1), { 'text-anchor':'start', fill:ERROR, 'font-size':9.5, 'fill-opacity':0.75 });\n    });\n    /* x-axis labels */\n    cats.forEach(function(c,i){\n      text(svg, xOf(i), H-3, c, { 'text-anchor':'middle', 'font-size':9 });\n    });\n\n    el.innerHTML = '';\n    el.appendChild(svg);\n  }\n\n  /* ───────────────────────────────────────────────────\n     PHASE 2 — framing gap line chart\n  ─────────────────────────────────────────────────── */\n  function drawP2() {\n    var el = document.getElementById('s6-chart-p2');\n    if (!el) return;\n    var W = el.offsetWidth || 460;\n    var H = 210;\n    var pad = { t:24, r:16, b:34, l:40 };\n    var cW = W - pad.l - pad.r;\n    var cH = H - pad.t - pad.b;\n\n    var cats   = ['2024Q3','2024Q4','2025Q1','2025Q3','2026Q1'];\n    var ceo    = [0.600, 0.000, 0.600, 0.700, 0.800];\n    var filing = [0.029, 0.137, 0.188, 0.269, 0.306];\n    var n = cats.length;\n    var yMin = -0.05, yMax = 0.95;\n\n    var xOf = function(i){ return pad.l + (i/(n-1))*cW; };\n    var yOf = function(v){ return pad.t + cH*(1-(v-yMin)/(yMax-yMin)); };\n\n    var svg = ns('svg', { width:W, height:H, viewBox:'0 0 '+W+' '+H });\n    gridLines(svg, pad.l, pad.t, cW, cH, [0, 0.25, 0.5, 0.75, 1]);\n\n    /* annotation at FY2024Q4 = index 1 */\n    annotationLine(svg, xOf(1), pad.t, cH, 'AML Consent Order', 'right');\n\n    /* gap fill between lines */\n    var ceoPts  = ceo.map(function(v,i){ return [xOf(i), yOf(v)]; });\n    var filePts = filing.map(function(v,i){ return [xOf(i), yOf(v)]; });\n    var gapPath = line(ceoPts) + ' ' + filePts.slice().reverse().map(function(p,i){ return (i?'L':'L')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ') + ' Z';\n    svg.appendChild(ns('path', { d:gapPath, fill:'rgba(207,45,86,0.07)', stroke:'none' }));\n\n    /* non-consecutive segs: 2→3 (skip Q2), 3→4 (skip Q4) */\n    var p2Dotted = [2, 3];\n\n    /* CEO line — segment-by-segment */\n    ceoPts.forEach(function(p,i){\n      if (i === ceoPts.length - 1) return;\n      var attrs = { d:'M'+p[0].toFixed(1)+','+p[1].toFixed(1)+' L'+ceoPts[i+1][0].toFixed(1)+','+ceoPts[i+1][1].toFixed(1), fill:'none', stroke:INK, 'stroke-width':2 };\n      if (p2Dotted.indexOf(i) !== -1) attrs['stroke-dasharray'] = '4,3';\n      svg.appendChild(ns('path', attrs));\n    });\n    ceoPts.forEach(function(p,i){\n      svg.appendChild(ns('circle', { cx:p[0], cy:p[1], r:3, fill:INK }));\n    });\n    /* highlight 0.000 */\n    svg.appendChild(ns('circle', { cx:ceoPts[1][0], cy:ceoPts[1][1], r:7, fill:'none', stroke:ERROR, 'stroke-width':2 }));\n\n    /* filing line — segment-by-segment */\n    filePts.forEach(function(p,i){\n      if (i === filePts.length - 1) return;\n      var attrs = { d:'M'+p[0].toFixed(1)+','+p[1].toFixed(1)+' L'+filePts[i+1][0].toFixed(1)+','+filePts[i+1][1].toFixed(1), fill:'none', stroke:GOLD, 'stroke-width':2 };\n      if (p2Dotted.indexOf(i) !== -1) attrs['stroke-dasharray'] = '4,3';\n      svg.appendChild(ns('path', attrs));\n    });\n    filePts.forEach(function(p){ svg.appendChild(ns('circle', { cx:p[0], cy:p[1], r:3, fill:GOLD })); });\n\n    /* y-axis */\n    [0, 0.3, 0.6, 0.9].forEach(function(v){\n      text(svg, pad.l-5, yOf(v)+4, v.toFixed(1), { 'text-anchor':'end', fill:INK55, 'font-size':9.5 });\n    });\n    /* x-axis */\n    cats.forEach(function(c,i){\n      text(svg, xOf(i), H-3, c, { 'text-anchor':'middle', 'font-size':9 });\n    });\n\n    el.innerHTML = '';\n    el.appendChild(svg);\n  }\n\n  /* ───────────────────────────────────────────────────\n     PHASE 3 — guidance bar chart\n  ─────────────────────────────────────────────────── */\n  function drawP3() {\n    var el = document.getElementById('s6-chart-p3');\n    if (!el) return;\n    var W = el.offsetWidth || 460;\n    var H = 210;\n    var pad = { t:24, r:16, b:34, l:40 };\n    var cW = W - pad.l - pad.r;\n    var cH = H - pad.t - pad.b;\n\n    var cats = ['2024Q3','2024Q4','2025Q1','2025Q2','2026Q1'];\n    var data = [12.9, 8.8, 17.8, 15.2, 16.5];\n    var n = cats.length;\n    var yMax = 22;\n\n    var slotW = cW / n;\n    var barW  = slotW * 0.55;\n    var xOf   = function(i){ return pad.l + slotW*i + slotW/2; };\n    var yOf   = function(v){ return pad.t + cH*(1 - v/yMax); };\n    var yBase = pad.t + cH;\n\n    var svg = ns('svg', { width:W, height:H, viewBox:'0 0 '+W+' '+H });\n    gridLines(svg, pad.l, pad.t, cW, cH, [0, 0.25, 0.5, 0.75, 1]);\n\n    data.forEach(function(v,i){\n      var x = xOf(i) - barW/2;\n      var y = yOf(v);\n      var bH = yBase - y;\n      var isDanger = i <= 1;  /* 2024Q3 and 2024Q4 are pre-recovery */\n      var fill   = isDanger ? 'rgba(207,45,86,0.20)' : 'rgba(31,138,101,0.65)';\n      var stroke = isDanger ? ERROR : SUCCESS;\n      svg.appendChild(ns('rect', { x:x, y:y, width:barW, height:bH, fill:fill, stroke:stroke, 'stroke-width':1.5, rx:2 }));\n      /* value label */\n      var vt = ns('text', { x:xOf(i), y:y-5, 'text-anchor':'middle', fill:isDanger?ERROR:SUCCESS, 'font-family':MONO, 'font-size':11, 'font-weight':'600' });\n      vt.textContent = v+'%';\n      svg.appendChild(vt);\n    });\n\n    [0, 5, 10, 15, 20].forEach(function(v){\n      text(svg, pad.l-5, yOf(v)+4, v+'%', { 'text-anchor':'end', fill:INK55, 'font-size':9.5 });\n    });\n    cats.forEach(function(c,i){\n      text(svg, xOf(i), H-3, c, { 'text-anchor':'middle', 'font-size':9 });\n    });\n\n    el.innerHTML = '';\n    el.appendChild(svg);\n  }\n\n  /* run after layout */\n  function render() { drawP1(); drawP2(); drawP3(); }\n  if (document.readyState === 'complete') {\n    requestAnimationFrame(function(){ requestAnimationFrame(render); });\n  } else {\n    window.addEventListener('load', function(){ requestAnimationFrame(function(){ requestAnimationFrame(render); }); });\n  }\n\n  /* re-render on slide change (deck-stage reveals new slides) */\n  window.addEventListener('message', function(e) {\n    if (e.data && typeof e.data.slideIndexChanged === 'number') {\n      requestAnimationFrame(function(){ requestAnimationFrame(render); });\n    }\n  });\n})();\n<\u002Fscript>\n<script>\n(function () {\n  var MONO_S7 = '\"Berkeley Mono\",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace';\n\n  var FOLDS = [\n    { label:'Fold 1',  trainS:'2021-02-25', trainE:'2023-02-28', testS:'2023-03-08', testE:'2023-06-06', days:'63d' },\n    { label:'Fold 2',  trainS:'2021-05-27', trainE:'2023-05-30', testS:'2023-06-07', testE:'2023-09-06', days:'63d' },\n    { label:'Fold 3',  trainS:'2021-08-26', trainE:'2023-08-29', testS:'2023-09-07', testE:'2023-12-05', days:'63d' },\n    { label:'...',     trainS:'',           trainE:'',           testS:'',           testE:'',           days:'' },\n    { label:'Fold 12', trainS:'2023-11-29', trainE:'2025-12-01', testS:'2025-12-09', testE:'2026-03-11', days:'63d' },\n    { label:'Fold 13', trainS:'2024-03-01', trainE:'2026-03-04', testS:'2026-03-12', testE:'2026-04-09', days:'20d' },\n  ];\n\n  var TICKS = [\n    { label:'Feb 2021', date:'2021-02-25' },\n    { label:'Mar 2023', date:'2023-03-08' },\n    { label:'Mar 2024', date:'2024-03-08' },\n    { label:'Mar 2025', date:'2025-03-11' },\n    { label:'Apr 2026', date:'2026-04-09' },\n  ];\n\n  var S = new Date('2021-02-25').getTime();\n  var E = new Date('2026-04-09').getTime();\n  var TOTAL = E - S;\n\n  function pct(d) { return (new Date(d).getTime() - S) / TOTAL * 100; }\n\n  function drawTimeline() {\n    var foldsEl = document.getElementById('s7new-folds');\n    var ticksEl = document.getElementById('s7new-ticks');\n    if (!foldsEl || !ticksEl) return;\n    if (foldsEl.children.length > 0) return; /* already rendered */\n\n    /* ticks */\n    ticksEl.innerHTML = '';\n    TICKS.forEach(function (t, i) {\n      var d = document.createElement('div');\n      var isLast = (i === TICKS.length - 1);\n      d.textContent = t.label;\n      d.style.position = 'absolute';\n      d.style.top = '0';\n      d.style.fontFamily = MONO_S7;\n      d.style.fontSize = '10px';\n      d.style.color = 'rgba(38,37,30,0.55)';\n      d.style.whiteSpace = 'nowrap';\n      if (isLast) {\n        d.style.right = '0';\n      } else {\n        d.style.left = pct(t.date).toFixed(1) + '%';\n        d.style.transform = 'translateX(-50%)';\n      }\n      ticksEl.appendChild(d);\n    });\n\n    /* fold rows */\n    foldsEl.innerHTML = '';\n    FOLDS.forEach(function (fold) {\n      var row = document.createElement('div');\n      row.style.display = 'flex';\n      row.style.gap = '8px';\n      row.style.alignItems = 'center';\n\n      /* label */\n      var lbl = document.createElement('div');\n      lbl.textContent = fold.label;\n      lbl.style.fontFamily = MONO_S7;\n      lbl.style.fontSize = '11px';\n      lbl.style.color = 'rgba(38,37,30,0.55)';\n      lbl.style.width = '52px';\n      lbl.style.flexShrink = '0';\n      row.appendChild(lbl);\n\n      if (fold.label === '...') {\n        var dots = document.createElement('div');\n        dots.style.flex = '1';\n        dots.style.height = '18px';\n        dots.style.borderTop = '1px dashed rgba(38,37,30,0.1)';\n        dots.style.borderBottom = '1px dashed rgba(38,37,30,0.1)';\n        dots.style.display = 'flex';\n        dots.style.alignItems = 'center';\n        dots.style.justifyContent = 'center';\n        var dotsLabel = document.createElement('span');\n        dotsLabel.textContent = 'middle folds follow the same rolling pattern';\n        dotsLabel.style.fontFamily = MONO_S7;\n        dotsLabel.style.fontSize = '10px';\n        dotsLabel.style.color = 'rgba(38,37,30,0.4)';\n        dots.appendChild(dotsLabel);\n        row.appendChild(dots);\n        var spacer = document.createElement('div');\n        spacer.style.width = '36px';\n        spacer.style.flexShrink = '0';\n        row.appendChild(spacer);\n      } else {\n        var trainL = pct(fold.trainS);\n        var trainW = pct(fold.trainE) - trainL;\n        var gapL   = pct(fold.trainE);\n        var testL  = pct(fold.testS);\n        var gapW   = testL - gapL;\n        var testW  = pct(fold.testE) - testL;\n\n        var track = document.createElement('div');\n        track.style.flex = '1';\n        track.style.height = '20px';\n        track.style.position = 'relative';\n        track.style.background = 'rgba(38,37,30,0.04)';\n        track.style.borderRadius = '4px';\n        track.style.overflow = 'hidden';\n\n        /* training bar */\n        var trainBar = document.createElement('div');\n        trainBar.style.position = 'absolute';\n        trainBar.style.top = '2px';\n        trainBar.style.bottom = '2px';\n        trainBar.style.left = trainL.toFixed(2) + '%';\n        trainBar.style.width = trainW.toFixed(2) + '%';\n        trainBar.style.background = 'rgba(38,37,30,0.18)';\n        trainBar.style.borderRadius = '3px';\n        track.appendChild(trainBar);\n\n        /* gap bar */\n        if (gapW > 0.1) {\n          var gapBar = document.createElement('div');\n          gapBar.style.position = 'absolute';\n          gapBar.style.top = '2px';\n          gapBar.style.bottom = '2px';\n          gapBar.style.left = gapL.toFixed(2) + '%';\n          gapBar.style.width = (gapW + 0.5).toFixed(2) + '%';\n          gapBar.style.background = '#f7f7f4';\n          gapBar.style.border = '1px solid rgba(38,37,30,0.12)';\n          gapBar.style.borderRadius = '3px';\n          gapBar.style.zIndex = '2';\n          gapBar.style.display = 'flex';\n          gapBar.style.alignItems = 'center';\n          gapBar.style.justifyContent = 'center';\n          var gapTxt = document.createElement('span');\n          gapTxt.textContent = 'gap';\n          gapTxt.style.fontFamily = MONO_S7;\n          gapTxt.style.fontSize = '7px';\n          gapTxt.style.color = 'rgba(38,37,30,0.35)';\n          gapTxt.style.whiteSpace = 'nowrap';\n          gapBar.appendChild(gapTxt);\n          track.appendChild(gapBar);\n        }\n\n        /* test bar */\n        var testBar = document.createElement('div');\n        testBar.style.position = 'absolute';\n        testBar.style.top = '2px';\n        testBar.style.bottom = '2px';\n        testBar.style.left = testL.toFixed(2) + '%';\n        testBar.style.width = testW.toFixed(2) + '%';\n        testBar.style.background = '#f54e00';\n        testBar.style.opacity = '0.72';\n        testBar.style.borderRadius = '3px';\n        testBar.style.zIndex = '1';\n        track.appendChild(testBar);\n\n        row.appendChild(track);\n\n        /* days label */\n        var daysEl = document.createElement('div');\n        daysEl.textContent = fold.days;\n        daysEl.style.fontFamily = MONO_S7;\n        daysEl.style.fontSize = '10px';\n        daysEl.style.color = 'rgba(38,37,30,0.4)';\n        daysEl.style.width = '36px';\n        daysEl.style.flexShrink = '0';\n        daysEl.style.textAlign = 'right';\n        row.appendChild(daysEl);\n      }\n\n      foldsEl.appendChild(row);\n    });\n  }\n\n  /* initial render — after layout settles */\n  function tryDraw() {\n    drawTimeline();\n    /* if elements weren't in DOM yet, retry once after a short delay */\n    if (!document.getElementById('s7new-folds') ||\n        document.getElementById('s7new-folds').children.length === 0) {\n      setTimeout(drawTimeline, 300);\n    }\n  }\n\n  if (document.readyState === 'complete' || document.readyState === 'interactive') {\n    requestAnimationFrame(tryDraw);\n  } else {\n    document.addEventListener('DOMContentLoaded', function () { requestAnimationFrame(tryDraw); });\n  }\n\n  /* re-draw whenever the user navigates to a new slide */\n  document.addEventListener('slidechange', drawTimeline);\n  window.addEventListener('message', function (e) {\n    if (e.data && typeof e.data.slideIndexChanged === 'number') {\n      requestAnimationFrame(drawTimeline);\n    }\n  });\n})();\n<\u002Fscript>\n\n\n<grammarly-desktop-integration data-grammarly-shadow-root=\"true\"><\u002Fgrammarly-desktop-integration><\u002Fbody><\u002Fhtml>"
